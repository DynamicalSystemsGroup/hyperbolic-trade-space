site_name: hyperbolic-trade-space
site_description: Posynomial invariant form for design trade spaces
site_url: https://dynamicalsystemsgroup.github.io/hyperbolic-trade-space/docs/
repo_url: https://github.com/DynamicalSystemsGroup/hyperbolic-trade-space
repo_name: DynamicalSystemsGroup/hyperbolic-trade-space
docs_dir: docs
strict: true

# The Glossary page is compiled from glossary.yaml into docs/generated/ by
# scripts/build_generated.py (assemble_site.py and stage_site.py run it first). The notes and
# specs are working material.
exclude_docs: |
  superpowers/
  references.bib

theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy]
  palette:
    - scheme: default
      primary: blue grey
      media: "(prefers-color-scheme: light)"
    - scheme: slate
      primary: blue grey
      media: "(prefers-color-scheme: dark)"

markdown_extensions:
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.superfences
  - admonition
  - footnotes
  - tables
  - toc: { permalink: true }

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search
  - bibtex:
      bib_file: docs/references.bib
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: false
            members_order: source

nav:
  - Home: index.md
  - Why and how: why-and-how.md
  - Mathematics: method.md
  - Derivations: generated/derivations.md
  - Preconditioning: preconditioning.md
  - Case: case.md
  - Verification and validation: generated/verification.md
  - API: api.md
  - API reference: api-reference.md
  - Extensions and limitations: limitations.md
  - Literature: literature.md
