# The claims register (docs/superpowers/notes/claims-review.md; WP10 Amendment 5, R-43).
# One [[claim]] per claim a reader can rely on. tests/test_claims_register.py checks every row.
#
# Fields
#   id           unique, C + digits
#   fragment     the sentence (or pieces joined by ' ... ', found in that order), verbatim from the
#                source file; comparison collapses whitespace and ignores '$' and '\' (LaTeX delimiters)
#   file         the source file (repo-relative): notebook markdown, docs page, or generator source
#   anchor       the section heading the fragment sits under (md/ipynb), or text that must occur in
#                the file (other types); '' = anywhere in the file
#   kind         M mathematics/method, R result of a run, S what the software does, L literature,
#                P practice (claims-review.md)
#   backing      list of 'type:value': lemma:L17 | lemma:L17.3 (a step tag) | test:path::name |
#                gen:path::name | func:path::name | file:path | bib:key | glossary:id | reading
#                (reading only for kind P: the author's own experience, marked as such)
#   status       backed | narrowed (only 'backed' passes the test)
#   disposition  keep | narrow | back
#   source       optional, the ticket or package that raised the claim; note: optional, what backs it
#
# Kind R needs a gen: and a test: backing.

