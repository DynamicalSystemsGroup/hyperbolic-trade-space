note = "L4's second derivative of J_tau along a direction v is (tau/2) sum_i sum_l p_i p_l (s_i - s_l)^2 with s_i = v . u_i (the double sum of L4.10 to L4.12). Along the swap v = e_j - e_j' of two identical columns every s_i is zero, so the curvature is zero: a one-line consequence of the formula, not a tagged step of its own."

