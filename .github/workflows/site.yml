name: Site

# Composes the whole site (root page, docs, the paper slot of paper/mode.toml) and uploads it as
# the Pages artefact (WP65 specification, 3.5). Called by release.yml; a dispatch builds on any
# branch. It never deploys: pages-deploy.yml does, called only by release.yml on a push to main.
# No test step: the suite runs once, in release.yml's test job.
on:
  workflow_call:
    outputs:
      slot:
        description: "What /paper/ holds: abstract, pin or fallback"
        value: ${{ jobs.compose.outputs.slot }}
      pin:
        description: "The paper tag served, empty in abstract mode"
        value: ${{ jobs.compose.outputs.pin }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    outputs:
      slot: ${{ steps.compose.outputs.slot }}
      pin: ${{ steps.compose.outputs.pin }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install (locked)
        run: uv sync --locked
      - name: Locked opensysml version
        id: opensysml
        run: |
          v=$(grep -A1 '^name = "opensysml"' uv.lock | grep '^version' | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache the opensysml runtime (downloaded on first use)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.opensysml
          key: opensysml-${{ runner.os }}-${{ steps.opensysml.outputs.version }}
      - name: Compose the site
        id: compose
        run: |
          uv run python scripts/assemble_site.py --out _site --summary "$GITHUB_STEP_SUMMARY" | tee compose.log
          read -r _ _ slot pin _ < <(grep '^assemble_site: slot ' compose.log)
          [ "$pin" = "-" ] && pin=""
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site
