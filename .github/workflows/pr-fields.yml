name: Pull request fields

# VC-4. Trigger: a pull request opened, edited, pushed to or labelled (Dependabot applies the `dependencies`
# label after the open, and the dependency row reads it). Same safety as pr-linked-issue.yml: the base branch
# is checked out and the description is read as data.
on:
  pull_request_target:
    types: [opened, edited, synchronize, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  fields:
    name: description fields filled
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Check the description's sections
        run: uv run --no-project python scripts/admissibility.py pr-fields --event "$GITHUB_EVENT_PATH" --report "$RUNNER_TEMP/report.md"
      - name: Say what is missing
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
