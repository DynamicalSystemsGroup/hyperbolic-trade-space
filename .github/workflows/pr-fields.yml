name: Pull request fields

# VC-4. Trigger: a pull request opened, edited or pushed to. Same safety as pr-linked-issue.yml: the base
# branch is checked out and the description is read as data.
on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  fields:
    name: description fields filled
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Check the description's sections
        run: uv run --no-project python scripts/admissibility.py pr-fields --event "$GITHUB_EVENT_PATH" --report "$RUNNER_TEMP/report.md"
      - name: Say what is missing
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
