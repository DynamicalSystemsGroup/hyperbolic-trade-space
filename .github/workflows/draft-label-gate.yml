name: Draft label gate

# VC-2. Trigger: a label removed from an issue. Only a code owner (.github/CODEOWNERS) may remove draft;
# any other removal is reverted and the issue says so.
on:
  issues:
    types: [unlabeled]

permissions:
  contents: read
  issues: write

jobs:
  gate:
    name: only a code owner removes draft
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Who removed the label
        run: uv run --no-project python scripts/admissibility.py label-gate --event "$GITHUB_EVENT_PATH" --report "$RUNNER_TEMP/report.md"
      - name: Restore the label
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label draft
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
