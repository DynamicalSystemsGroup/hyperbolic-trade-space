name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19 (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # uv reads .python-version itself; setup-uv has no python-version-file input.
      - uses: astral-sh/setup-uv@v7
      - name: Check the lockfile is current
        run: uv lock --check
      - name: Install (locked)
        run: uv sync --locked
      - name: Test
        run: uv run pytest -q
