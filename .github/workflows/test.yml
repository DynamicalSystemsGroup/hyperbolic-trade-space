name: Tests

# Manual dispatch only (the driver dispatches once per batch of pushes; verification in tiers).
on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Also run the Windows job (WP34 spike)"
        type: boolean
        default: false

env:
  # The modules that build the site, the docs and the paper (they share generated files).
  DOCS_MODULES: >-
    tests/test_site.py tests/test_build_generated.py tests/test_docs.py tests/test_paper.py
    tests/test_container.py tests/test_narrative.py

jobs:
  test:
    name: test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [fast, slow, docs-paper]
    # Pinned: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19 (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: No AI attribution lines in commit messages (project rule)
        run: |
          hits=$(git log --format=%B | grep -ciE '\bco-authored-by\b|\bgenerated with\b|🤖' || true)
          if [ "$hits" != "0" ]; then
            echo "::error::$hits commit message(s) carry an AI attribution line; the project forbids them."
            git log --format='%h %s%n%b' | grep -iE -B2 '\bco-authored-by\b|\bgenerated with\b|🤖' || true
            exit 1
          fi
      # uv reads .python-version itself; setup-uv has no python-version-file input.
      - uses: astral-sh/setup-uv@v7
      - name: Check the lockfile is current
        run: uv lock --check
      - name: Install (locked)
        run: uv sync --locked
      - name: Locked opensysml version
        id: opensysml
        run: |
          v=$(grep -A1 '^name = "opensysml"' uv.lock | grep '^version' | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache the opensysml runtime (downloaded on first use)
        uses: actions/cache@v4
        with:
          path: ~/.opensysml
          key: opensysml-${{ runner.os }}-${{ steps.opensysml.outputs.version }}
      # The model-checking tests need the pinned sysml-toolkit (examples/adcs/experiments/
      # toolkit-pin.toml). The helper verifies the archive's size and sha256 before extracting it
      # and requires the standard library clone to be at the pinned commit.
      # The cache is restored before and saved right after provisioning, not at the end of the
      # job, so a failing test run does not leave every later run downloading again.
      - name: Restore the pinned sysml-toolkit
        id: toolkit-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/hyperbolic-trade-space
          key: sysml-toolkit-${{ runner.os }}-${{ hashFiles('examples/adcs/experiments/toolkit-pin.toml') }}
      - name: Provision the pinned sysml-toolkit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The helper is idempotent (a cache hit opens no connection), retries, and falls back
          # to the release-assets API. If its routes all fail, fetch the asset with gh and install
          # from the local file. Every route verifies the pinned size and sha256 before extraction.
          if PYTHONPATH=examples/adcs uv run python -m experiments.toolkit fetch; then exit 0; fi
          read -r repo tag asset < <(PYTHONPATH=examples/adcs uv run python -m experiments.toolkit pin)
          gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "$RUNNER_TEMP"
          PYTHONPATH=examples/adcs uv run python -m experiments.toolkit fetch --archive "$RUNNER_TEMP/$asset"
      - name: Save the pinned sysml-toolkit
        if: steps.toolkit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/hyperbolic-trade-space
          key: sysml-toolkit-${{ runner.os }}-${{ hashFiles('examples/adcs/experiments/toolkit-pin.toml') }}
      # fast + slow + docs-paper = every test: unmarked tests; marked slow outside the docs
      # modules; marked slow inside them.
      - name: Test (${{ matrix.shard }})
        env:
          REQUIRE_OPENSYSML: "1"
          SHARD: ${{ matrix.shard }}
        run: |
          opts="-q -n auto --dist loadgroup"
          case "$SHARD" in
            fast) uv run pytest $opts -m "not slow" ;;
            slow)
              ignores=""
              for m in $DOCS_MODULES; do ignores="$ignores --ignore=$m"; done
              uv run pytest $opts -m slow $ignores ;;
            docs-paper) uv run pytest $opts -m slow $DOCS_MODULES ;;
          esac

  windows:
    name: windows (${{ matrix.shard }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows }}
    # The docs-paper shard stays on Linux and macOS (WP34 stage 2 decision).
    strategy:
      fail-fast: false
      matrix:
        shard: [fast, slow]
    defaults:
      run:
        shell: bash
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Versions (OS, uv, python, node)
        run: |
          uname -a || true
          cmd //c ver || true
          uv --version
          uv run --no-project python --version
          node --version || echo "node: not found"
          git --version
          git config --get core.autocrlf || echo "core.autocrlf: unset"
      - name: Install (locked)
        run: uv sync --locked
      - name: Lock check
        run: uv lock --check
      # The z3-solver wheel installs z3.exe in <venv>\bin, which a Windows venv does not put on PATH
      # (it adds Scripts); the engines find the solver by PATH.
      - name: z3 on PATH
        run: |
          test -f .venv/bin/z3.exe
          echo "$(cygpath -w "$PWD/.venv/bin")" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Locked opensysml version
        id: opensysml
        run: |
          v=$(grep -A1 '^name = "opensysml"' uv.lock | grep '^version' | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The spike reads what breaks; a failed provision is data, not a stop.
      - name: Provision the pinned sysml-toolkit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=examples/adcs uv run python -m experiments.toolkit fetch
      - name: Test (${{ matrix.shard }})
        env:
          REQUIRE_OPENSYSML: "1"
          SHARD: ${{ matrix.shard }}
        run: |
          opts="-q -n auto --dist loadgroup"
          case "$SHARD" in
            fast) uv run pytest $opts -m "not slow" ;;
            slow)
              ignores=""
              for m in $DOCS_MODULES; do ignores="$ignores --ignore=$m"; done
              uv run pytest $opts -m slow $ignores ;;
          esac
