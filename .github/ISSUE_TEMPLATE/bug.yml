name: Bug report
description: Something the package does that its documentation says it should not.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what the documentation says should happen
      description: Quote or link the page, docstring or example that sets the expectation.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: A minimal example that shows it
      description: Code that runs as pasted, with the data or a way to generate it.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `python -c "import hyperbolic_trade_space as h; print(h.__version__)"`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python, scikit-learn and operating system
    validations:
      required: true
