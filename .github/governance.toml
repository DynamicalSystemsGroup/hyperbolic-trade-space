# The repository's release rules as settings, declared (GOVERNANCE.md). scripts/check_repo_settings.py
# reads the live settings through the GitHub API and compares them with this file field by field; the
# `controls` job runs it first in the Tests and Release workflows, and a release's notes carry the
# result at the merge commit. The values are the settings read back on 2026-11-17
# (work-packages/WP68-rounds/record.md, G7), decided in work-packages/WP64-decisions.md. A change of a
# setting starts here: the declaration changes first, then the setting, and the next run checks them.

schema = 1
repository = "DynamicalSystemsGroup/tradespace"

# Settings, Actions, General, Workflow permissions: read, and a workflow may not approve a pull request
# (the design of 2026-11-16; live was write through 0.1; decided 2026-11-17, WP82, set after the merge).
# checked_on = "local": GET actions/permissions/workflow needs the Administration (read) permission,
# which GitHub never grants to the workflow token, so the controls job (--runner) lists these two
# fields as not checked on the runner and a code owner's local run checks them. Every other section
# is checked_on = "both" (the default, implicit): on the runner and locally.
[actions]
checked_on = "local"
local_reason = "GET actions/permissions/workflow needs Administration (read), which the workflow token never has"
default_workflow_permissions = "read"
can_approve_pull_request_reviews = false

# Settings, Pages: built and deployed by the Release workflow (pages-deploy.yml), not from a branch.
[pages]
build_type = "workflow"

# Settings, General, Pull Requests: "Automatically delete head branches" (GOVERNANCE.md, "Branches":
# a pull request's branch is deleted at its merge; decided 2026-11-17, WP82 Amendment 3, set after
# the merge; live was off through 0.1). The REST field delete_branch_on_merge of
# GET repos/{owner}/{repo}, read on the runner (Metadata). The table is named for the settings page,
# since the key `repository` above is the repository's name.
[general]
delete_branch_on_merge = true

# Who holds authority: the logins on the `*` line of CODEOWNERS, the one record of who may approve,
# merge and release (decided 2026-11-17, 13:40). Each must be a collaborator with at least this access
# (the legacy roles: read < write < admin; GitHub reports maintain as write).
[code_owners]
file = ".github/CODEOWNERS"
minimum_permission = "write"

# The paper's approvers: the logins on the `paper/` line of the same file (decided 2026-11-17,
# 13:05: "paper PRs are approved by mzargham or jshorish"), who review and merge pull requests into
# `paper` and are the `paper-release` environment's reviewers; a login on this line is not thereby a
# code owner. Approval needs no write access, so the minimum is read; GitHub asks write of a login
# on a CODEOWNERS line before it requests their review, and both hold it today (maintain, admin).
[paper_approvers]
file = ".github/CODEOWNERS"
pattern = "paper/"
minimum_permission = "read"

# ---------------------------------------------------------------------------------------- rulesets
# Settings, Rules, Rulesets. Every ruleset the repository has is listed here; one the repository has
# and this file does not is a difference.

# The review on main: a pull request with one approval and a code owner's review, merged as a merge
# commit. No bypass. For the 0.1 release the ruleset carried a bypass for one user (User 10465438,
# mzargham, pull requests only; decided 2026-11-17, 11:25, set by name that afternoon); it is removed
# after 0.1 by this change first, then on the ruleset page by a code owner, whose local run of the
# checker attests it (decided 2026-11-17, 12:05 and 13:20; named in the 0.2 changelog).
[[rulesets]]
name = "main-review"
target = "branch"
enforcement = "active"
include = ["~DEFAULT_BRANCH"]
exclude = []
bypass_actors = []
# The API returns bypass actors to administrators only; the workflow token sees an empty list, so the
# field is compared locally and listed as not checked on the runner (the first controls run, 2026-11-17).
[rulesets.fields.bypass_actors]
checked_on = "local"
local_reason = "the API returns a ruleset's bypass actors to administrators only; the workflow token sees an empty list"

[[rulesets.rules]]
type = "pull_request"
[rulesets.rules.parameters]
required_approving_review_count = 1
require_code_owner_review = true
allowed_merge_methods = ["merge"]
dismiss_stale_reviews_on_push = false
require_last_push_approval = false
required_review_thread_resolution = false
require_extra_approval_for_unattributed_changes = true
required_reviewers = []

# The checks on main, no bypass: the controls job (the settings against this file; added 2026-11-17,
# WP82, set after the merge), the three test shards and admissibility, branches up to date; no deletion,
# no force push.
[[rulesets]]
name = "main-checks"
target = "branch"
enforcement = "active"
include = ["~DEFAULT_BRANCH"]
exclude = []
bypass_actors = []
# The API returns bypass actors to administrators only; the workflow token sees an empty list, so the
# field is compared locally and listed as not checked on the runner (the first controls run, 2026-11-17).
[rulesets.fields.bypass_actors]
checked_on = "local"
local_reason = "the API returns a ruleset's bypass actors to administrators only; the workflow token sees an empty list"

[[rulesets.rules]]
type = "deletion"

[[rulesets.rules]]
type = "non_fast_forward"

[[rulesets.rules]]
type = "required_status_checks"
[rulesets.rules.parameters]
strict_required_status_checks_policy = true
do_not_enforce_on_create = false
required_status_checks = ["controls", "test (fast)", "test (slow)", "test (docs)", "admissibility"]

# dev: day-to-day commits land directly; no deletion, no force push.
[[rulesets]]
name = "dev"
target = "branch"
enforcement = "active"
include = ["refs/heads/dev"]
exclude = []
bypass_actors = []
# The API returns bypass actors to administrators only; the workflow token sees an empty list, so the
# field is compared locally and listed as not checked on the runner (the first controls run, 2026-11-17).
[rulesets.fields.bypass_actors]
checked_on = "local"
local_reason = "the API returns a ruleset's bypass actors to administrators only; the workflow token sees an empty list"

[[rulesets.rules]]
type = "deletion"

[[rulesets.rules]]
type = "non_fast_forward"

# paper: the paper's branch, the same two rules.
[[rulesets]]
name = "paper"
target = "branch"
enforcement = "active"
include = ["refs/heads/paper"]
exclude = []
bypass_actors = []
# The API returns bypass actors to administrators only; the workflow token sees an empty list, so the
# field is compared locally and listed as not checked on the runner (the first controls run, 2026-11-17).
[rulesets.fields.bypass_actors]
checked_on = "local"
local_reason = "the API returns a ruleset's bypass actors to administrators only; the workflow token sees an empty list"

[[rulesets.rules]]
type = "deletion"

[[rulesets.rules]]
type = "non_fast_forward"

# governance-files: the control on the governed files (the secondary rules below; decided 2026-11-17,
# WP82: CODEOWNERS lines plus a push ruleset). A push that touches one of the paths is refused unless
# the pusher is a Repository admin, the one bypass actor, always on: a push ruleset has no
# pull-requests-only mode and a pull request's merge is a push too. Who approves a change to a governed
# file is its CODEOWNERS line; who pushes it is this ruleset. A push ruleset has no branch condition.
[[rulesets]]
name = "governance-files"
target = "push"
enforcement = "active"
bypass_actors = [{ actor_type = "RepositoryRole", actor_id = 5, bypass_mode = "always" }]
# The API returns bypass actors to administrators only; the workflow token sees an empty list, so the
# field is compared locally and listed as not checked on the runner (the first controls run, 2026-11-17).
[rulesets.fields.bypass_actors]
checked_on = "local"
local_reason = "the API returns a ruleset's bypass actors to administrators only; the workflow token sees an empty list"

[[rulesets.rules]]
type = "file_path_restriction"
[rulesets.rules.parameters]
restricted_file_paths = [
  ".github/CODEOWNERS",
  ".github/governance.toml",
  ".github/workflows/*.yml",
  "GOVERNANCE.md",
  ".github/ISSUE_ADMISSIBILITY.md",
  ".github/PR_ADMISSIBILITY.md",
  ".github/RELEASE_ADMISSIBILITY.md",
  ".github/ISSUE_TEMPLATE/*.yml",
  ".github/pull_request_template.md",
]

# ------------------------------------------------------------------------------------ environments
# Settings, Environments. `deployment_branches = "selected"` is "Selected branches and tags" with the
# policies listed; `reviewers` are the required reviewers (none: the deployment waits for nobody).

[[environments]]
name = "github-pages"
deployment_branches = "selected"
policies = [{ type = "branch", name = "main" }]
reviewers = []
can_admins_bypass = true

# No required reviewer: the merge into main is the release decision (decided 2026-11-16).
[[environments]]
name = "pypi"
deployment_branches = "selected"
policies = [{ type = "branch", name = "main" }]
reviewers = []
can_admins_bypass = true

[[environments]]
name = "testpypi"
deployment_branches = "selected"
policies = [{ type = "branch", name = "dev" }]
reviewers = []
can_admins_bypass = true

# The paper's approvers, set apart from the code owners (decided 2026-11-17, 12:05 and 13:05); the one
# who pushed the tag does not approve it; no administrator bypass.
[[environments]]
name = "paper-release"
deployment_branches = "selected"
policies = [{ type = "tag", name = "paper-*" }]
reviewers = ["jshorish", "mzargham"]
prevent_self_review = true
can_admins_bypass = false

# ---------------------------------------------------------------------------------- governed files
# The repository's secondary rules (the rules about how its rules are made, changed and enforced;
# decided 2026-11-17, 13:40 and 13:45): a small enumerated set, nothing added to it without a
# governed change. `check` is "executable" (a script or a test checks it; `by` names which) or
# "guideline" (a named role judges it; `by` names who). `codeowners` is the file's own line in
# .github/CODEOWNERS, whose logins approve a change to it (the three code owners; decided 2026-11-17,
# WP82); `control` is how each is edited: approved by that line, pushed by a Repository admin, since
# the governance-files push ruleset above refuses any other push that touches these paths.

[[governed_files]]
path = ".github/CODEOWNERS"
codeowners = "/.github/CODEOWNERS"
rule = "who holds authority: the code owners (the * line) and the paper's approvers (the paper/ line)"
check = "executable"
by = "scripts/check_repo_settings.py (each code owner's and each paper approver's access); scripts/admissibility.py and tests/test_admissibility.py (the merge row, into dev and into paper)"
control = "approved by the owners on its CODEOWNERS line (the three code owners); pushed by a Repository admin, directly to dev or as the merge of a pull request (the governance-files push ruleset)"

[[governed_files]]
path = ".github/governance.toml"
codeowners = "/.github/governance.toml"
rule = "the settings that enforce the release rules"
check = "executable"
by = "scripts/check_repo_settings.py in the controls job; tests/test_repo_settings.py"
control = "approved by the owners on its CODEOWNERS line (the three code owners); pushed by a Repository admin, directly to dev or as the merge of a pull request (the governance-files push ruleset)"

[[governed_files]]
path = ".github/workflows/*.yml"
codeowners = "/.github/workflows/"
rule = "what runs, gates and publishes"
check = "executable"
by = "scripts/release_checks.py pins; tests/test_release_workflows.py, tests/test_ci_shards.py, tests/test_release_checks.py, tests/test_paper_model.py"
control = "approved by the owners on its CODEOWNERS line (the three code owners); pushed by a Repository admin, directly to dev or as the merge of a pull request (the governance-files push ruleset)"

[[governed_files]]
path = "GOVERNANCE.md"
codeowners = "/GOVERNANCE.md"
rule = "the release rules in prose, the two reviews, the secondary rules"
check = "guideline"
by = "a code owner, at the review of any change to it; its list of secondary rules is checked against this file by tests/test_repo_settings.py"
control = "approved by the owners on its CODEOWNERS line (the three code owners); pushed by a Repository admin, directly to dev or as the merge of a pull request (the governance-files push ruleset)"

[[governed_files]]
path = ".github/ISSUE_ADMISSIBILITY.md"
codeowners = "/.github/ISSUE_ADMISSIBILITY.md"
rule = "when a draft becomes an issue"
check = "guideline"
by = "a code owner who removes the draft label (the fitness rows); the machine rows run in issue-admissibility.yml and draft-label-gate.yml"
control = "approved by the owners on its CODEOWNERS line (the three code owners); pushed by a Repository admin, directly to dev or as the merge of a pull request (the governance-files push ruleset)"

[[governed_files]]
path = ".github/PR_ADMISSIBILITY.md"
codeowners = "/.github/PR_ADMISSIBILITY.md"
rule = "when a pull request is reviewed and merged into dev"
check = "guideline"
by = "the code owner who reviews and merges (the fitness rows); the machine rows run in pr-linked-issue.yml, pr-fields.yml, merge-by-code-owner.yml and test.yml"
control = "approved by the owners on its CODEOWNERS line (the three code owners); pushed by a Repository admin, directly to dev or as the merge of a pull request (the governance-files push ruleset)"

[[governed_files]]
path = ".github/RELEASE_ADMISSIBILITY.md"
codeowners = "/.github/RELEASE_ADMISSIBILITY.md"
rule = "when a merge into main is a release"
check = "guideline"
by = "the code owner who merges the release (the fitness row); the machine rows run in release.yml"
control = "approved by the owners on its CODEOWNERS line (the three code owners); pushed by a Repository admin, directly to dev or as the merge of a pull request (the governance-files push ruleset)"

[[governed_files]]
path = ".github/ISSUE_TEMPLATE/*.yml"
codeowners = "/.github/ISSUE_TEMPLATE/"
rule = "what an issue asks for"
check = "executable"
by = "tests/test_admissibility.py (the scope-of-work template carries the fields the checks read); the forms themselves, on GitHub"
control = "approved by the owners on its CODEOWNERS line (the three code owners); pushed by a Repository admin, directly to dev or as the merge of a pull request (the governance-files push ruleset)"

[[governed_files]]
path = ".github/pull_request_template.md"
codeowners = "/.github/pull_request_template.md"
rule = "what a pull request asks for"
check = "executable"
by = "tests/test_admissibility.py (the template carries the sections the pr-fields check reads)"
control = "approved by the owners on its CODEOWNERS line (the three code owners); pushed by a Repository admin, directly to dev or as the merge of a pull request (the governance-files push ruleset)"
