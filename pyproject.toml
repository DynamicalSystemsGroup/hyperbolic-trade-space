[project]
name = "hyperbolic-trade-space"
version = "0.0.1"
description = "Learn the shape of a design trade space: a scikit-learn-compatible posynomial (monomial first) frontier model with an invertible log-ratio chart, SymPy-verified derivations, and an ADCS trade-study case."
readme = "README.md"
authors = [{ name = "Michael Zargham" }]
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["trade space", "posynomial", "geometric programming", "Pareto frontier", "scikit-learn", "systems engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "sympy>=1.12",
    "scikit-learn>=1.8",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://dynamicalsystemsgroup.github.io/hyperbolic-trade-space/"
Documentation = "https://dynamicalsystemsgroup.github.io/hyperbolic-trade-space/docs/"
Repository = "https://github.com/DynamicalSystemsGroup/hyperbolic-trade-space"
Issues = "https://github.com/DynamicalSystemsGroup/hyperbolic-trade-space/issues"
Changelog = "https://github.com/DynamicalSystemsGroup/hyperbolic-trade-space/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5",
]
docs = ["mkdocs-material>=9.5", "mkdocs-jupyter>=0.24", "mkdocstrings[python]>=0.26", "mkdocs-bibtex>=2.16"]
notebooks = ["jupyter>=1.0", "nbconvert>=7"]
paper = ["mystmd>=1.9", "ipykernel>=6", "nbclient>=0.10"]
case = ["opensysml>=0.12.1", "z3-solver>=4.13"]

[tool.uv]
default-groups = ["dev", "case", "docs", "paper"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperbolic_trade_space"]

# The sdist carries the package, the tests, the licence, the readme and the changelog, and nothing else.
[tool.hatch.build.targets.sdist]
include = ["/src/hyperbolic_trade_space", "/tests", "/LICENSE", "/README.md", "/CHANGELOG.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE"
pythonpath = [".", "src", "examples/adcs"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Research-spike folders hold throwaway scripts kept for reproducibility, and the package-user cells' returns are
# evidence kept verbatim (their code blocks are the cells' own); neither is package code.
extend-exclude = ["docs/superpowers/notes/spike-horopca", "docs/superpowers/notes/spike-sysml-diagrams", "docs/superpowers/notes/spike-facet-refit", "docs/superpowers/notes/spike-figure1", "work-packages/spikes", "work-packages/WP32-cells/round-*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
