[project]
name = "hyperbolic-trade-space"
version = "0.0.1"
description = "Learn the shape of a design trade space: a scikit-learn-compatible posynomial (monomial first) frontier model with an invertible log-ratio chart, SymPy-verified derivations, and an ADCS trade-study case."
readme = "README.md"
authors = [{ name = "Michael Zargham" }]
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "sympy>=1.12",
    "scikit-learn>=1.8",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
docs = ["mkdocs-material>=9.5", "mkdocs-jupyter>=0.24", "mkdocstrings[python]>=0.26", "mkdocs-bibtex>=2.16"]
notebooks = ["jupyter>=1.0", "nbconvert>=7"]
case = ["opensysml>=0.12.1"]

[tool.uv]
default-groups = ["dev", "case"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperbolic_trade_space"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE"
pythonpath = [".", "src", "examples/adcs"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Research-spike folders hold throwaway scripts kept for reproducibility; they are not package code.
extend-exclude = ["docs/superpowers/notes/spike-*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
