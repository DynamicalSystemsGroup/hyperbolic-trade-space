# The glossary: the single source of the register's phrases and the symbols a user meets.
#
# Compiled by scripts/build_generated.py into the docsite Glossary page (term and short only,
# grouped alphabetically). The other fields are the source of the paper's register table
# (docs/superpowers/notes/notation.md holds the long form).
#
# Fields
#   id          unique lower-case slug
#   term        the phrase the prose uses
#   symbol      optional, LaTeX without delimiters
#   short       one line for a user (no line break)
#   register    the register's phrase for the object
#   formal      the formal object
#   not         what it is not
#   defined_in  optional, where it is defined or proved (lemma and ledger ids)
#   aliases     optional list of strings: variants the prose may use for the term (plural,
#               abbreviation); each resolves to this entry
#   avoid       optional list of {phrase, reason}: variants that must not appear in prose, each
#               with the reason (docs/superpowers/notes/vocabulary-review.md)
#
# File-level lists besides `entries`
#   assumed     optional list of {term, reason}: standard vocabulary assumed of the reader (calculus,
#               linear algebra, convex optimization at the level of Boyd and Vandenberghe,
#               scikit-learn's documented terms), each with the reason it needs no entry here
#   stems       optional list of strings: the stems that mark a term of art in this subject; a
#               phrase built on one must resolve to an entry, an alias or an assumed term
entries:
  - id: 'configuration'
    term: 'configuration'
    symbol: 'c'
    short: 'The design variables the engineer chooses (wheel class, gains); carried as covariates, not fitted.'
    register: 'configuration'
    formal: 'the design variables of one evaluated design'
    not: 'an input of the fit; the fit sees attributes and metrics only'
    defined_in: 'Prediction from configuration'

  - id: 'attributes'
    term: 'attributes'
    symbol: 'a'
    short: 'What the evaluation returns (seconds, kilograms); raw, in mixed units and directions.'
    register: 'attributes'
    formal: 'the evaluation outcomes of a configuration; the evaluation is a black box (simulator, physical test or human assessment)'
    not: 'metrics; attributes are not conditioned, positive or oriented'
    defined_in: 'A4'

  - id: 'metrics'
    term: 'metrics'
    symbol: 'm \in \mathbb{R}^d_{++}'
    short: 'The conditioned attributes: strictly positive, larger is better; the input to the fit.'
    register: 'metrics'
    formal: 'the conditioned attributes, a point of the positive orthant'
    not: 'the raw attributes; zero is tolerated in data and masked in the fit'
    defined_in: 'A1, A4, L9'

  - id: 'log-metrics'
    term: 'log-metrics'
    symbol: 'u = \log m'
    short: 'The metrics in log space, where every fit happens and a monomial becomes a hyperplane.'
    register: 'log-metrics'
    formal: 'the componentwise logarithm of the metrics'
    not: 'the chart coordinates Z'
    defined_in: 'L1, A1'

  - id: 'conditioning'
    term: 'conditioning'
    short: 'The analyst''s step that turns attributes into metrics; LogAffinePreconditioner does it.'
    register: 'conditioning'
    formal: 'the log-affine, invertible map from attributes to metrics'
    not: 'part of the fit; the fit consumes metrics'
    defined_in: 'A4, L9'

  - id: 'number-of-designs'
    term: 'number of designs'
    symbol: 'N'
    short: 'The rows of the table; each row is one evaluated configuration.'
    register: 'number of designs'
    formal: 'the number of evaluated configurations'
    not: 'a sample drawn from the attainable set'
    defined_in: 'The model'

  - id: 'number-of-metrics'
    term: 'number of metrics'
    symbol: 'd'
    short: 'The length of the metric vector; the dimension of the trade space.'
    register: 'number of metrics'
    formal: 'the dimension of the trade space'
    not: 'the number of configuration variables'
    defined_in: 'The model, A0'

  - id: 'number-of-terms'
    term: 'number of terms'
    symbol: 'K'
    short: 'How many monomials the frontier has; the analyst''s choice, never selected by the fit.'
    register: 'number of terms'
    formal: 'the number of monomials of the posynomial frontier'
    not: 'a selected or estimated quantity'
    defined_in: 'L10, A6'

  - id: 'invariant-value'
    term: 'invariant value'
    symbol: 'V(m) = \prod_j m_j^{w_j}'
    short: 'A weighted geometric mean of the metrics; doubling every metric doubles it, so it reads as a factor of improvement.'
    register: 'invariant value'
    formal: 'the weighted geometric mean of the metrics'
    not: 'a probability or a bounded score; V above 1 is possible at finite temperature'
    defined_in: 'L1, A1, A2'

  - id: 'exponent-vector'
    term: 'exponent vector'
    symbol: 'w_k'
    short: 'The weights of term k on the simplex over the metrics; its positive entries name the metrics that contend.'
    register: 'exponent vector'
    formal: 'a point on the simplex over the d metrics'
    not: 'a loading vector with sign or unit norm'
    defined_in: 'A2, L3, L4'

  - id: 'facet'
    term: 'facet'
    short: 'One flat piece of the fitted surface in log space, the geometry of one term of the posynomial.'
    register: 'facet'
    formal: 'the flat piece of the fitted surface in log space; the same object as a term and a monomial'
    not: 'a face of the Pareto boundary or of the data''s convex hull'
    defined_in: 'L10'

  - id: 'term'
    term: 'term'
    short: 'One monomial of the posynomial, the algebra of one facet.'
    register: 'term'
    formal: 'a product of powers of the metrics'
    not: 'a cluster of designs'
    defined_in: 'L10'

  - id: 'monomial'
    term: 'monomial'
    short: 'A positive coefficient times the metrics raised to real powers; one term of a posynomial, a hyperplane in log-metrics.'
    register: 'monomial'
    formal: 'a positive constant times each metric raised to a real power; its logarithm is affine in the log-metrics'
    not: 'a posynomial (a sum of monomials), or a cluster of designs'
    defined_in: 'Definition Posynomial, L4.17'
    aliases:
      - 'monomials'

  - id: 'posynomial'
    term: 'posynomial'
    short: 'A sum of monomials; the fit''s K-term sum is one, and the fitted reference surface is where that sum equals one.'
    register: 'posynomial'
    formal: 'a sum of monomials with positive coefficients; here the sum of the fit''s terms, each a monomial in the metrics'
    not: 'the invariant, which is a root of the sum, or a polynomial with coefficients of either sign'
    defined_in: 'Definition Posynomial, L10'
    aliases:
      - 'posynomials'

  - id: 'generalized-posynomial'
    term: 'generalized posynomial'
    short: 'A function built from posynomials by sums, products, positive powers and maxima (Boyd et al. 2007); the invariant V_K belongs to this class.'
    register: 'generalized posynomial'
    formal: 'a function of the class closed under sums, products, positive powers and maxima that contains the posynomials; a class of functions'
    not: 'a name for the fitted reference surface, which is a level set of a posynomial, or for a class of problems (that is a generalized geometric program)'
    defined_in: 'Boyd et al. 2007, section 5; the one cited sentence of the Methods'
    aliases:
      - 'generalized posynomials'

  - id: 'geometric-program'
    term: 'geometric program'
    short: 'The minimization of a posynomial under posynomial inequality and monomial equality constraints; convex after x = exp(y).'
    register: 'geometric program'
    formal: 'minimize a posynomial subject to posynomial constraints at most one and monomial constraints equal to one, over positive variables; the logarithmic change of variables makes it a convex program'
    not: 'the several-facet fit as one program, which is not convex in the terms (L16); with the weights given, the fit of all terms is a generalized geometric program'
    defined_in: 'L4.14 to L4.24'
    aliases:
      - 'geometric programs'
      - 'GP'
      - 'geometric programming'

  - id: 'generalized-geometric-program'
    term: 'generalized geometric program'
    short: 'A program that minimizes a generalized posynomial under generalized-posynomial inequality constraints and monomial equality constraints (Boyd et al. 2007, section 5.4); convex after x = exp(y).'
    register: 'generalized geometric program'
    formal: 'minimize a generalized posynomial subject to generalized-posynomial constraints at most one and monomial constraints equal to one, over positive variables; the logarithmic change of variables makes it a convex program, and added variables turn it into a geometric program'
    not: 'a function class, or the unsupervised several-facet fit as one program (not convex in the terms); the older use of the phrase for signomial programs; a design problem that uses the fitted model is one, and so is the fit with its weights given'
    defined_in: 'Boyd et al. 2007, section 5.4; L16 (iii)'
    aliases:
      - 'generalized geometric programs'
      - 'generalized geometric programming'
      - 'GGP'

  - id: 'fitted-reference-surface'
    term: 'fitted reference surface'
    symbol: '\Phi(u) = 0'
    short: 'The level V = 1 of the fitted invariant at finite temperature, a model of the data underlying the table; rows above it exist by construction.'
    register: 'fitted reference surface'
    formal: 'the level set V = 1 of the fitted invariant, where the posynomial sum equals one; it models the data (the evaluated designs)'
    not: 'the Pareto boundary, or a bound that no design exceeds; the table and the reading drawn from it are views of the data, not what is modelled'
    defined_in: 'L3, L5, G-1'
    avoid:
      - phrase: 'generalized posynomial reference surface'
        reason: 'the surface is the level set of a posynomial; generalized names the class the invariant belongs to'
      - phrase: 'generalized posynomial surface'
        reason: 'the surface is the level set of a posynomial; generalized names the class the invariant belongs to'
      - phrase: 'model of the table'
        reason: 'the surface models the data underlying the table; the table and its reading are views'
      - phrase: 'models the table'
        reason: 'the surface models the data underlying the table; the table and its reading are views'

  - id: 'supporting-envelope'
    term: 'supporting envelope'
    short: 'The fit at infinite temperature, the exact maximum; a hyperplane that supports the observed rows from above.'
    register: 'supporting envelope'
    formal: 'the hyperplane of the infinite-temperature fit, found by a linear program'
    not: 'an envelope of the attainable set'
    defined_in: 'L5, I1, G-1'

  - id: 'pareto-boundary'
    term: 'Pareto boundary'
    short: 'The nondominated points of the attainable set, a property of the system the data sample.'
    register: 'Pareto boundary'
    formal: 'the set of nondominated points of the attainable set'
    not: 'the fitted reference surface or the supporting envelope'
    defined_in: 'L11, G-1, G-13'

  - id: 'frontier'
    term: 'frontier'
    short: 'Everyday word for one of three objects; the pages name them as the fitted reference surface, the supporting envelope or the Pareto boundary.'
    register: 'frontier'
    formal: 'not a defined object; allowed where the context fixes which of the three is meant'
    not: 'a synonym for the Pareto boundary'
    defined_in: 'Words'

  - id: 'energy-differential'
    term: 'energy differential'
    symbol: '\log V'
    short: 'The log of the invariant value, relative to the fitted reference surface; negative inside, positive beyond; returned by score_samples.'
    register: 'energy differential'
    formal: 'the potential evaluated at the design, a path-independent difference'
    not: 'a Euclidean distance'
    defined_in: 'L1, L2, L13'

  - id: 'level-offset'
    term: 'level offset'
    symbol: '\log V'
    short: 'Another name for the energy differential, read as the offset from the level V = 1.'
    register: 'level offset'
    formal: 'the energy differential read against the level V = 1'
    not: 'a distance'
    defined_in: 'L1, L2'

  - id: 'improvement-factor'
    term: 'improvement factor'
    symbol: 'V^{-1/w_j}'
    short: 'The factor on one metric alone that brings a design to V = 1.'
    register: 'improvement factor'
    formal: 'the single-metric scaling that carries the design to V = 1'
    not: 'the factor that brings the design to the Pareto boundary'
    defined_in: 'L7'

  - id: 'chart'
    term: 'chart'
    symbol: '(Z, \log V)'
    short: 'The reversible transformation between metric space and the fitting space; nothing is lost either way.'
    register: 'chart'
    formal: 'the reversible map from metrics to (Z, log V)'
    not: 'defined for a row with a zero metric'
    defined_in: 'L8, L9'

  - id: 'position-along-the-frontier'
    term: 'position along the frontier'
    symbol: 'Z \in \mathbb{R}^{d-1}'
    short: 'The other d - 1 chart coordinates, free of overall scale; where in the trade space a design sits.'
    register: 'position along the frontier'
    formal: 'the Helmert log-ratio coordinates of the chart'
    not: 'a position on the Pareto boundary'
    defined_in: 'L8, A7, I6'

  - id: 'white-space'
    term: 'white space'
    short: 'A hole in the chart coordinates; a region of the trade space no evaluated design occupies.'
    register: 'white space'
    formal: 'a hole in the distribution of Z'
    not: 'evidence that a design there is attainable'
    defined_in: 'Novelty and white space'

  - id: 'temperature'
    term: 'fit temperature'
    symbol: '\tau'
    short: 'How hard the maximum is in the one-sided fit; infinite is the exact maximum, finite gives a band of near-frontier designs.'
    register: 'fit temperature'
    formal: 'the entropic softness of the log-mean-exp'
    not: 'a noise level or a model parameter fitted from the data'
    defined_in: 'L5, A3, G-9'

  - id: 'term-temperature'
    term: 'term temperature'
    symbol: '\kappa'
    short: 'How sharply the facets meet; larger is a crisp envelope with corners.'
    register: 'term temperature'
    formal: 'the softness of the soft maximum over the K terms'
    not: 'the fit temperature'
    defined_in: 'L10, A6'

  - id: 'support-weights'
    term: 'support weights'
    symbol: 'p_i'
    short: 'The softmax weights of the designs in the fit; which designs hold up the fitted surface.'
    register: 'support weights'
    formal: 'the softmax weights of the rows in the log-mean-exp'
    not: 'probabilities of a sampling model'
    defined_in: 'L3, A3'

  - id: 'contending-set'
    term: 'contending set'
    short: 'The metrics with positive exponent in the exact-maximum fit; the members of the n-lemma.'
    register: 'contending set'
    formal: 'the support of the exponent vector at infinite temperature'
    not: 'the participants at the working temperature; a statement about the whole system'
    defined_in: 'L3, I1, G-2, G-12'

  - id: 'n-lemma'
    term: 'n-lemma'
    symbol: 'n_k'
    short: 'How many of the d metrics contend on a facet; a dilemma is 2, a trilemma 3; found from the data, not assumed.'
    register: 'n-lemma'
    formal: 'the size of the contending set of one facet'
    not: 'a count of metrics in tension in the data'
    defined_in: 'L3, G-2'

  - id: 'elasticity'
    term: 'elasticity'
    symbol: '-w_k / w_j'
    short: 'Along a facet, the percentage of one metric given up per percentage gained in another.'
    register: 'elasticity'
    formal: 'the derivative of one log-metric with respect to another along the facet; a ratio of exponents'
    not: 'a causal exchange or an intervention effect'
    defined_in: 'L7, A1, A2, G-3'
    aliases:
      - 'elasticities'
    avoid:
      - phrase: 'exchange rate'
        reason: 'it reads as money; the quantity is a ratio of exponents, the percentage of one metric given up per percentage gained in another, and the theorem that derives it (L7) is named for elasticities'
      - phrase: 'exchange rates'
        reason: 'it reads as money; the quantity is a ratio of exponents, the percentage of one metric given up per percentage gained in another, and the theorem that derives it (L7) is named for elasticities'

  - id: 'participation-threshold'
    term: 'participation threshold'
    short: 'A working-temperature exponent above 1e-3 participates in the tension; the threshold is a parameter of tension_report.'
    register: 'participation threshold'
    formal: 'the exponent cutoff for membership in the participating set'
    not: 'a statistical test'
    defined_in: 'G-2, G-5'

  - id: 'numerically-zero'
    term: 'numerically zero'
    short: 'An exponent at or below 1e-12; the code treats it as zero, which is not the same as mathematically zero.'
    register: 'numerically zero'
    formal: 'an exponent below EPS_ZERO_EXPONENT'
    not: 'mathematically zero'
    defined_in: 'G-2, G-5'

  - id: 'assignment'
    term: 'assignment'
    short: 'Which facet is active for a design, the one with the largest score; the facet index is a label.'
    register: 'assignment'
    formal: 'the maximizing term of the posynomial at the design'
    not: 'an identity that survives ties between scores'
    defined_in: 'L13, R2, G-10'

  - id: 'facet-gap'
    term: 'facet gap'
    symbol: 'G_k'
    short: 'The first-order gap of a facet''s refit; zero exactly when the optimality conditions hold.'
    register: 'facet gap'
    formal: 'the first-order gap of the facet''s refit on the simplex'
    not: 'the distance to the optimum'
    defined_in: 'L12, L3, L4, I8, F12'

  - id: 'assignment-margin'
    term: 'assignment margin'
    symbol: '\gamma'
    short: 'The smallest gap by which a design''s facet beats the runner-up; positive means each design has one maximizing facet.'
    register: 'assignment margin'
    formal: 'the minimum over rows of the best score minus the second-best'
    not: 'the objective''s margin'
    defined_in: 'L13, R2'

  - id: 'stable-radius'
    term: 'stable radius'
    short: 'A perturbation of the facets smaller than this leaves every design''s assignment unchanged.'
    register: 'stable radius'
    formal: 'gamma divided by twice the largest row norm'
    not: 'a bound on estimation error'
    defined_in: 'L13, I9, R2'

  - id: 'termination-status'
    term: 'termination status'
    short: 'Which level of guarantee the returned run meets: certified, stationary without margin, uncertified, guard stop, iteration cap or not applicable.'
    register: 'termination status'
    formal: 'the label of the termination record'
    not: 'a statement about the choice among restarts'
    defined_in: 'L12 to L14, G-15, G-16'

  - id: 'conditioning-of-the-exponents'
    term: 'conditioning of the exponents'
    symbol: 'conditioning_'
    short: 'The smallest eigenvalue of the restricted Hessian at each facet; small means a nearly flat direction.'
    register: 'conditioning of the exponents'
    formal: 'the smallest eigenvalue of the restricted Hessian of the objective on the simplex tangent space'
    not: 'a confidence interval'
    defined_in: 'L3, L4, R1, G-2'

  - id: 'novelty'
    term: 'novelty'
    symbol: 'V - 1'
    short: 'How far a design lies beyond the fitted reference surface; a score for white space and new capabilities.'
    register: 'novelty'
    formal: 'V minus 1'
    not: 'a measure of attainability'
    defined_in: 'Novelty and white space'

assumed:
  - term: 'convex program'
    reason: 'convex optimization at the level of Boyd and Vandenberghe 2004'
  - term: 'linear program'
    reason: 'convex optimization at the level of Boyd and Vandenberghe 2004'
  - term: 'simplex'
    reason: 'the probability simplex of Boyd and Vandenberghe 2004; named in Preliminaries'
  - term: 'KKT conditions'
    reason: 'Boyd and Vandenberghe 2004, section 5.5.3'
  - term: 'Hessian'
    reason: 'multivariate calculus'
  - term: 'eigenvalue'
    reason: 'linear algebra'
  - term: 'log-sum-exp'
    reason: 'Boyd and Vandenberghe 2004, section 3.1.5; the paper uses the log-mean-exp, which it defines'
  - term: 'principal component analysis'
    reason: 'standard multivariate statistics; the scikit-learn documented vocabulary (PCA)'
  - term: 'unsupervised learning'
    reason: 'the scikit-learn documented vocabulary (Pedregosa et al. 2011)'
  - term: 'feature engineering'
    reason: 'the scikit-learn documented vocabulary (Pedregosa et al. 2011; Buitinck et al. 2013)'
  - term: 'kernel'
    reason: 'the scikit-learn documented vocabulary of kernel methods (Pedregosa et al. 2011)'
  - term: 'estimator'
    reason: 'the scikit-learn documented vocabulary (Pedregosa et al. 2011; Buitinck et al. 2013)'
  - term: 'transformer'
    reason: 'the scikit-learn documented vocabulary (Pedregosa et al. 2011; Buitinck et al. 2013)'

stems:
  - 'posynomial'
  - 'monomial'
  - 'program'
  - 'frontier'
  - 'facet'
  - 'envelope'
  - 'surface'
  - 'chart'
  - 'lemma'
  - 'rate'
  - 'margin'
  - 'radius'
  - 'temperature'
  - 'gap'
