# The register of prior art: the single source of Appendix G and of the family table in section 2.
#
# One entry per work or family. Compiled by paper/generate_prior_art.py; never typed into a table.
# Restates what the verified sources say, at the depth recorded in each `verified` field of
# docs/references.bib and in docs/superpowers/notes/paper-prior-art-sources.md. The "differs" cells
# are the project's own statements (spec, outline addenda), not statements of the sources.
# The HoroPCA row is backed by the first spike docs/superpowers/notes/spike-horopca/ (the authors'
# code, run on the paper's tables) and by the pre-registered experiment of Appendix H
# (work-packages/WP35-rounds/spike-h/); Appendix H prints its results table from results.json.
#
# Fields
#   id           unique lower-case slug
#   group        the family group the appendix sorts under
#   family       the name of the work or family
#   does         what it does, in a sentence
#   shares       what this work shares with it or takes from it
#   differs      what this work does differently, extends or adds (never empty). One voice: every
#                `differs` cell, and `short.differs`, opens "This work" and has this work as its
#                subject; what the family does, including its limits, goes in `does`
#                (tests/test_paper.py::test_every_differs_cell_has_this_work_as_its_subject)
#   cites        bibliography keys (docs/references.bib), each resolved
#   section2     true if the entry is also a row of section 2's table
#   short        required with section2: the phrases of the table, each an extract of its field
#   why_not_just required where `nearest` is true: the plain sentence "why this is not just X"
#   nearest      true for the nearest neighbours named in the appendix sketch
#
# Rules (tests/test_paper.py): no entry without `differs`; the words "novel", "first" and "new" are
# absent from the fields; every cited key resolves in docs/references.bib.
entries:
  # --- Optimization and efficiency analysis ---------------------------------------------------
  - id: pareto
    group: Optimization and efficiency analysis
    family: Pareto and multiobjective optimization
    does: >-
      Returns a nondominated set of designs, and finds Pareto-optimal solutions by scalarization, for
      example the weighting method; evolutionary algorithms generate nondominated sets. A nondominated
      set says which designs survive, by a hard comparison.
    shares: >-
      A maximizer of a weighted geometric mean with positive exponents is Pareto-efficient (lemma
      L11), and the weights act as a trade-off.
    differs: >-
      This work returns a coordinate system and exponents: the fit says what trades against what,
      with one exponent vector per term, a band of near-boundary designs and an effective sample
      size. It compares by a soft maximum, not by dominance, and identifies a surface from a table
      without generating designs.
    cites: [miettinen1999nonlinear, ehrgott2005multicriteria, zitzler1999multiobjective, deb2002fast]
    section2: true
    # Section 2's table prints these phrases; each is an extract of the field of the same name
    # (a test checks it). Appendix G prints the full sentences.
    short:
      does: "Returns a nondominated set of designs"
      shares: "A maximizer of a weighted geometric mean with positive exponents is Pareto-efficient"
      differs: "This work returns a coordinate system and exponents"
    nearest: true
    why_not_just: >-
      This is not just a Pareto front: a front is the set of designs that no other design dominates,
      while the fit returns a reference surface with coordinates, and for each term the exponents
      that give the elasticities between metrics.

  - id: dea
    group: Optimization and efficiency analysis
    family: Data envelopment analysis (DEA)
    does: >-
      Evaluates the relative efficiency of each decision-making unit by mathematical programming on
      the observed data, with weights obtained from the data. It has variants for scale and returns
      to scale, a super-efficiency variant that ranks efficient units against a reference
      technology spanned by all other units, and Malmquist productivity indices across data sets.
    shares: >-
      A one-sided envelope of the data, a score per unit, scores beyond the boundary (V above 1)
      and a boundary that moves between data sets.
    differs: >-
      This work fits global exponents per term, not per-unit weights, and reports a band, not
      extreme units. Its exponent vector per term is a global named structure, and its surface is
      piecewise log-linear, with constant elasticities within a term. Its metrics are
      larger-is-better with homogeneity by the simplex in place of inputs, outputs and a
      returns-to-scale choice. Its boundary is a soft maximum with a temperature, a band and an
      effective sample size in place of a deterministic boundary set by extreme units. It solves one
      convex program and K refits, and returns coordinates and a pull-back to attribute units in
      place of a score and a peer set.
    cites: [charnes1978measuring, banker1984some, andersen1993procedure, fare1994productivity, allen1997weights, dyson2001pitfalls]
    section2: true
    # Section 2's table prints these phrases; each is an extract of the field of the same name
    # (a test checks it). Appendix G prints the full sentences.
    short:
      does: "Evaluates the relative efficiency of each decision-making unit"
      shares: "A one-sided envelope of the data, a score per unit"
      differs: "This work fits global exponents per term, not per-unit weights"
    nearest: true
    why_not_just: >-
      This is not just DEA: DEA scores each unit against the envelope under weights obtained from the data,
      while the fit learns one set of exponents per term from the whole table and reports where a
      design sits relative to its term and which metrics trade there.

  - id: multiplicative-dea
    group: Optimization and efficiency analysis
    family: Multiplicative DEA
    does: >-
      A multiplicative efficiency model whose envelopment is piecewise Cobb-Douglas (Charnes, Cooper,
      Seiford and Stutz, read by title). Linear programs for piecewise log-linear estimation of the
      efficient boundary of production, derived from properties postulated for the production
      possibility set, which admit increasing marginal products and S-shaped production functions
      and estimate technical inefficiencies, rates of substitution and transformation, marginal
      products and returns to scale (Banker and Maindiratta, read by abstract).
    shares: >-
      A piecewise log-linear fit to the data from above, each piece a product of powers; a score per
      unit against it.
    differs: >-
      This work fits one exponent vector per term to every design at once under a soft maximum with
      a temperature and a band, the number of terms the analyst's choice. Its metrics are
      larger-is-better with homogeneity by the simplex in place of inputs and outputs, and it
      returns coordinates and a pull-back to attribute units in place of a score per unit.
    cites: [charnes1982multiplicative, charnes1983invariant, banker1986piecewise]
    section2: false

  - id: hyperbolic-graph-measure
    group: Optimization and efficiency analysis
    family: The hyperbolic graph measure of efficiency
    does: >-
      Efficiency measures on the graph of a technology, inputs and outputs both freely variable, in
      place of measures that hold the outputs or the inputs fixed (the chapter "Hyperbolic Graph
      Efficiency Measures", read by abstract).
    shares: >-
      A boundary of a technology, and each unit measured against it with no quantity held fixed:
      V scores a design against the fitted reference surface with every metric free.
    differs: >-
      This work fits products of powers of larger-is-better metrics to a table under a soft
      maximum and scales no inputs against outputs. Its word "hyperbolic" is defined in Appendix A,
      and is not this measure.
    cites: [fare1985measurement]
    section2: false

  - id: production-distance
    group: Optimization and efficiency analysis
    family: Production and distance functions
    does: >-
      The Cobb-Douglas production form, and the Shephard distance function with its duality.
    shares: >-
      The weighted geometric mean with exponents summing to one is the constant-returns
      Cobb-Douglas form; V read as a scaling factor to the boundary is a distance-function reading.
    differs: >-
      This work takes attributes in place of inputs, and fits the form from a table of designs with
      a soft maximum.
    cites: [cobb1928theory, shephard1970theory, fare1995multi, farrell1957measurement]
    section2: true
    # Section 2's table prints these phrases; each is an extract of the field of the same name
    # (a test checks it). Appendix G prints the full sentences.
    short:
      does: "The Cobb-Douglas production form, and the Shephard distance function"
      shares: "the constant-returns Cobb-Douglas form"
      differs: "This work takes attributes in place of inputs"
    nearest: true
    why_not_just: >-
      This is not just a production or distance function: those are economic forms for inputs and
      outputs, while here the same product of powers is fitted to a table of attributes, as the
      one-sided boundary of conditioned metrics.

  - id: frontier-estimation
    group: Optimization and efficiency analysis
    family: Deterministic and stochastic frontiers
    does: >-
      Estimates frontier production functions by programming, corrected ordinary least squares or
      maximum likelihood, and stochastic frontiers with one-sided error.
    shares: >-
      A one-sided criterion on log-linear residuals.
    differs: >-
      This work uses a smooth soft maximum over a simplex-constrained geometric mean in place of a
      shifted intercept, and K terms.
    cites: [aigner1968estimating, afriat1972efficiency, richmond1974estimating, greene1980maximum, aigner1977formulation, battese1992frontier]
    section2: true
    # Section 2's table prints these phrases; each is an extract of the field of the same name
    # (a test checks it). Appendix G prints the full sentences.
    short:
      does: "Estimates frontier production functions"
      shares: "A one-sided criterion on log-linear residuals"
      differs: "This work uses a smooth soft maximum over a simplex-constrained geometric mean"
    nearest: true
    why_not_just: >-
      This is not just a stochastic frontier: a frontier estimate shifts the intercept of a log-linear
      fit to bound the data, with a one-sided error, while the fit here is a soft maximum over a
      simplex-constrained geometric mean, with a temperature, a band and K terms.

  # --- Dimension reduction and model fitting --------------------------------------------------
  - id: pca
    group: Dimension reduction and model fitting
    family: Principal component analysis (PCA)
    does: >-
      Finds uncorrelated components that successively maximize variance, reducing dimensionality
      while keeping interpretability.
    shares: >-
      The question "what explains this table", answered by an unsupervised summary in a few
      directions.
    differs: >-
      This work's criterion is a one-sided soft maximum, not variance, and its exponents live on the
      simplex, so its components are trade-offs between metrics. The two chain. This work belongs
      beside PCA in unsupervised learning and feature engineering and is not a PCA.
    cites: [jolliffe2016principal]
    section2: true
    # Section 2's table prints these phrases; each is an extract of the field of the same name
    # (a test checks it). Appendix G prints the full sentences.
    short:
      does: "Finds uncorrelated components that successively maximize variance"
      shares: "an unsupervised summary in a few directions"
      differs: "This work's criterion is a one-sided soft maximum, not variance"
    nearest: true
    why_not_just: >-
      This is not just PCA: PCA explains variance, which is analysis and says nothing about what
      trades against what, while the fit explains the edge of the table by the trade-offs among
      metrics.

  - id: logratio
    group: Dimension reduction and model fitting
    family: Compositional and log-ratio PCA
    does: >-
      PCA of compositional data, and isometric logratio transformations for compositional data
      analysis.
    shares: >-
      The chart Z = Bu is in the spirit of an isometric logratio chart.
    differs: >-
      This work's criterion is one-sided; its weights lie on the simplex, and its chart is paired
      with the level log V and is reversible to the metrics and to attribute units.
    cites: [aitchison1983principal, aitchison1986statistical, egozcue2003isometric]
    section2: true
    # Section 2's table prints these phrases; each is an extract of the field of the same name
    # (a test checks it). Appendix G prints the full sentences.
    short:
      does: "PCA of compositional data"
      shares: "an isometric logratio chart"
      differs: "This work's criterion is one-sided; its weights lie on the simplex"
    nearest: true
    why_not_just: >-
      This is not just log-ratio analysis: the log-ratio chart is one half of the coordinate
      system, and the other half is the level log V relative to a fitted one-sided surface, which
      log-ratio analysis does not fit.

  - id: gp-maxaffine
    group: Dimension reduction and model fitting
    family: Geometric programming and max-affine fitting
    does: >-
      Geometric programming with generalized posynomials, aircraft design as geometric programs with
      fits compatible with them, softmax-affine fits compatible with geometric programming,
      convex piecewise-linear fits, and reweighted ℓ₁ sparsity. The sources fit regression
      surfaces.
    shares: >-
      The model class, the K > 1 refit scheme and the sparsity option.
    differs: >-
      This work fits an envelope, the one-sided boundary of the data, and reads its exponents as
      elasticities.
    cites: [boyd2007tutorial, hoburg2014geometric, hoburg2016data, magnani2009convex, candes2008enhancing]
    section2: true
    # Section 2's table prints these phrases; each is an extract of the field of the same name
    # (a test checks it). Appendix G prints the full sentences.
    short:
      does: "Geometric programming with generalized posynomials"
      shares: "The model class, the K > 1 refit scheme"
      differs: "This work fits an envelope, the one-sided boundary of the data"
    nearest: true
    why_not_just: >-
      This is not just geometric-programming or max-affine fitting: those fit a surface through
      the middle of the data by regression, while this fits the edge of the data and reports the
      terms as trade-offs.

  - id: kernel-pca
    group: Dimension reduction and model fitting
    family: Kernel PCA
    does: >-
      PCA in an implicit feature space, reached through kernel functions: principal components of
      data in a feature space nonlinearly related to the input space.
    shares: >-
      Kernel PCA is the feature-engineering kin of the kernel direction that stays compatible with
      geometric programming.
    differs: >-
      This work builds no kernel and maximizes no variance: it fits a one-sided posynomial edge,
      and its kernel direction is documented, not built.
    cites: [schoelkopf1998nonlinear]
    section2: true
    # Section 2's table prints these phrases; each is an extract of the field of the same name
    # (a test checks it). Appendix G prints the full sentences.
    short:
      does: "PCA in an implicit feature space"
      shares: "the feature-engineering kin of the kernel direction"
      differs: "This work builds no kernel and maximizes no variance"

  - id: horopca
    group: Dimension reduction and model fitting
    family: HoroPCA (PCA in hyperbolic space)
    does: >-
      PCA components carried into hyperbolic space with horospherical projections (a
      parameterization of subspaces, a projection and a variance objective), for data that lives on
      a hyperbolic manifold such as an embedded tree; it maximizes a nonconvex variance over frames
      by gradient ascent with restarts, and gives no certificate.
    shares: >-
      The closest existing analog in setting: unsupervised, a table in and coordinates out, with the
      number of components chosen by the analyst, and PCA as a step that can follow.
    differs: >-
      This work estimates a one-sided edge, not a variance over frames, by convex programs on a
      simplex with a certificate, and it uses no negative-curvature geometry; on the synthetic
      tables of Appendix H, the leading components of PCA and HoroPCA recover the exponents only
      where the generator made them the direction of largest spread.
    cites: [chami2021horopca]
    section2: true
    # Section 2's table prints these phrases; each is an extract of the field of the same name
    # (a test checks it). Appendix G prints the full sentences.
    short:
      does: "PCA components carried into hyperbolic space"
      shares: "The closest existing analog in setting"
      differs: "This work estimates a one-sided edge, not a variance over frames"

  - id: entropic-risk
    group: Dimension reduction and model fitting
    family: Entropic risk
    does: >-
      The entropic risk measure and its limits (the mean and the essential supremum), and entropic
      value-at-risk.
    shares: >-
      The log-mean-exp soft maximum is the sample version of the entropic risk functional.
    differs: >-
      This work uses nothing from the risk-measure side; the entries are cited to avoid confusion
      of the soft maximum with a risk measure.
    cites: [foellmer2026entropic, ahmadijavid2012entropic]
    section2: false

  # --- Systems engineering practice and decision analysis -------------------------------------
  - id: mdao
    group: Systems engineering practice and decision analysis
    family: Multidisciplinary design analysis and optimization (MDAO)
    does: >-
      Couples the disciplinary analyses of a design through shared coupling variables and solves
      the coupled system inside an optimizer: a survey of the field by its conceptual components,
      a classification of its architectures by problem formulation and decomposition strategy, a
      diagram standard for them (which extends the design structure matrix with process
      flow), a framework that solves the coupled models and computes their coupled derivatives,
      and a textbook treatment. Each run returns an optimum of a stated objective under
      constraints.
    shares: >-
      The setting of the case, a design loop in which a configuration is evaluated by coupled
      disciplinary models into attributes and the design variables are chosen against several
      objectives. The case's coupling table is a design structure matrix.
    differs: >-
      This work fits the table the evaluations leave behind and reports the trade-offs they
      exercised. It gives one exponent vector per monomial term and a level for every design,
      whatever produced the table. It does not search, couple disciplines or need derivatives; an MDAO run
      is one way to fill the table.
    cites: [sobieszczanski1997multidisciplinary, martins2013multidisciplinary, lambe2012extensions, gray2019openmdao, martins2021engineering]
    section2: true
    # Section 2's table prints these phrases; each is an extract of the field of the same name
    # (a test checks it). Appendix G prints the full sentences.
    short:
      does: "solves the coupled system inside an optimizer"
      shares: "a configuration is evaluated by coupled disciplinary models into attributes"
      differs: "This work fits the table the evaluations leave behind"

  - id: tradespace
    group: Systems engineering practice and decision analysis
    family: Tradespace exploration
    does: >-
      Value-focused broad exploration of design alternatives, a design-by-shopping interface in
      which the decision-maker forms a preference by viewing many good designs, user-guided
      samplers and linked visualization with the Pareto frontier displayed, and tradespace
      exploration for resilient systems.
    shares: >-
      The setting, a table of evaluated designs.
    differs: >-
      This work fits and reports a coordinate system and a score.
    cites: [ross2004multi, ross2005tradespace, ross2010revisiting, stump2003design, simpson2008visual, stump2009visual, spero2014tradespace]
    section2: true
    # Section 2's table prints these phrases; each is an extract of the field of the same name
    # (a test checks it). Appendix G prints the full sentences.
    short:
      does: "Value-focused broad exploration of design alternatives"
      shares: "The setting, a table of evaluated designs"
      differs: "This work fits and reports a coordinate system and a score"
    nearest: true
    why_not_just: >-
      This is not just tradespace exploration: exploration samples and shows the designs, while
      this fits the table and returns the trade-offs and a score for each design in coordinates
      that can be inverted.

  - id: decision-analysis
    group: Systems engineering practice and decision analysis
    family: Decision analysis and multiple-criteria methods
    does: >-
      Decision analysis with a normative versus descriptive distinction. Multiple-objective
      preferences and value trade-offs. Weighted-criteria comparison methods (Pugh, the analytic
      hierarchy process, Kepner-Tregoe), with weights elicited. A decision-management framework
      based on decision theory and cost analysis.
    shares: >-
      The weights are trade-off rates.
    differs: >-
      This work fits its weights from the data's edge and elicits none.
    cites: [howard1988decision, keeney1993decisions, baker2012survey, parnell2016trade]
    section2: true
    # Section 2's table prints these phrases; each is an extract of the field of the same name
    # (a test checks it). Appendix G prints the full sentences.
    short:
      does: "Decision analysis with a normative versus descriptive distinction"
      shares: "The weights are trade-off rates"
      differs: "This work fits its weights from the data's edge"

  - id: practice
    group: Systems engineering practice and decision analysis
    family: Trade studies in systems engineering practice
    does: >-
      Describes the trade study as a documented decision activity, with elicited criteria weights
      and known susceptibility to human bias. It surveys the published state of trade-off analytics.
    shares: >-
      The setting, a decision for which an answer and a justification are required.
    differs: >-
      This work fits its weights from the table and reruns the analysis when the data change. The
      study is a computation with a recorded environment, not a document.
    cites: [hirshorn2017nasa, baker2012survey, chilli2026decision, smith2007ameliorating, parnell2021system]
    section2: false

  - id: mbse
    group: Systems engineering practice and decision analysis
    family: Model-based systems engineering
    does: >-
      MBSE centred on the system model as the sole source of truth; a systematic review of the
      evidence for MBSE benefits, opening from document-based practice.
    shares: >-
      The trade space as a model rather than a document.
    differs: >-
      This work is a model-based trade analysis, not an MBSE methodology; the system model stays
      behind its abstraction from configuration to attributes.
    cites: [madni2018model, henderson2021value]
    section2: true
    # Section 2's table prints these phrases; each is an extract of the field of the same name
    # (a test checks it). Appendix G prints the full sentences.
    short:
      does: "MBSE centred on the system model as the sole source of truth"
      shares: "The trade space as a model rather than a document"
      differs: "This work is a model-based trade analysis, not an MBSE methodology"
