<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="220" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>


  <!-- four stages, one fill -->
  <rect x="70" y="90" width="140" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="140" y="126" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">evaluate</text>

  <rect x="280" y="90" width="140" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="350" y="126" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">condition</text>

  <rect x="510" y="90" width="140" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="580" y="126" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">identify</text>

  <rect x="720" y="90" width="140" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="790" y="126" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">analyse</text>

  <!-- data between stages -->
  <line x1="14" y1="120" x2="68" y2="120" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="108" text-anchor="middle" font-size="16" font-style="italic" fill="#111827">c</text>

  <line x1="212" y1="120" x2="278" y2="120" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="108" text-anchor="middle" font-size="16" font-style="italic" fill="#111827">a</text>

  <line x1="422" y1="120" x2="508" y2="120" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="465" y="108" text-anchor="middle" font-size="16" font-style="italic" fill="#111827">m</text>

  <line x1="652" y1="120" x2="718" y2="120" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="685" y="108" text-anchor="middle" font-size="16" font-style="italic" fill="#111827">w, β</text>

  <!-- one line under each: what the stage is -->
  <text x="40" y="170" text-anchor="middle" font-size="12" fill="#374151">configurations</text>
  <text x="140" y="170" text-anchor="middle" font-size="12" fill="#374151">a black box</text>
  <text x="245" y="170" text-anchor="middle" font-size="12" fill="#374151">attributes</text>
  <text x="350" y="170" text-anchor="middle" font-size="12" fill="#374151">feature engineering</text>
  <text x="465" y="170" text-anchor="middle" font-size="12" fill="#374151">metrics</text>
  <text x="580" y="170" text-anchor="middle" font-size="12" fill="#374151">fit the surface</text>
  <text x="685" y="170" text-anchor="middle" font-size="12" fill="#374151">the trade-offs</text>
  <text x="790" y="170" text-anchor="middle" font-size="12" fill="#374151">decision analysis</text>
</svg>
