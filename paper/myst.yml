version: 1
# The build infrastructure is modelled on the SciPy 2026 article
# (hc-scipy-2026/papers/michael_zargham/myst.yml); the outline and development follow the IEEE
# structure recorded in work-packages/WP10-decisions.md. Standalone: it does not extend a shared file.
project:
  id: hyperbolic-trade-space-paper
  # paper.ipynb is the paper (the notebook is the paper); supporting_material.ipynb is published
  # beside it as the lettered appendices (Appendices A to G).
  index: paper.ipynb
  numbering:
    headings: true
  toc:
    - file: paper.ipynb
    - file: supporting_material.ipynb
  # Working title; the final title and subtitle are set in WP11.
  title: Scaling Decision Analysis with Hyperbolic Trade Space Identification
  description: |
    A scikit-learn-compatible posynomial frontier model that identifies the trade-offs in a table of
    evaluated designs, with every claim backed by computationally verifiable supporting material.
  github: https://github.com/DynamicalSystemsGroup/hyperbolic-trade-space
  authors:
    - name: Michael Zargham
      orcid: 0000-0001-5279-690X
      affiliations:
        - Dynamical Systems Group
  keywords:
    - decision analysis
    - trade studies
    - trade space
    - posynomial
    - geometric programming
    - unsupervised learning
    - model-based systems engineering
    - open source software
  # Acronyms used in prose; every abbreviation in the paper's prose appears here, except PCA: the builder
  # matches an abbreviation inside a longer word and underlined the PCA of "HoroPCA" (WP35 amendment 1),
  # so PCA is spelled out at its first use, in the abstract, and again in Appendix H.
  abbreviations:
    ADCS: attitude determination and control system
    DEA: data envelopment analysis
    GGP: generalized geometric programming
    GP: geometric programming
    KKT: Karush-Kuhn-Tucker
    LP: linear program
    MBSE: model-based systems engineering
  bibliography:
    - ../docs/references.bib
  # DOI exists-check ignore list: entries recorded with a stable URL and no DOI (docs/references.bib).
  error_rules:
    - rule: doi-exists
      severity: ignore
      keys:
        - cobb1928theory
        - aigner1968estimating
        - fare1994productivity
        - foellmer2026entropic
        - chami2021horopca
        - billingsley2012probability
        - pedregosa2011scikit
        - parnell2016trade
        - hirshorn2017nasa
        - baker2012survey
        - chilli2026decision
  # No export block: the PDF export is deferred (OD4, decided "Later, once the content has settled").
site:
  # Pinned to the commit of myst-templates/article-theme that is theme v1.4.1 (the name
  # `article-theme` alone resolves to the repository's main branch, which moved to v2.0.0 on
  # 2026-11-10 and does not render this paper). Change it only with a rendered-paper review.
  template: https://github.com/myst-templates/article-theme/archive/4acce1eba558b301c2aadca99a7804aa6e294e1e.zip
  options:
    # a narrow screen clips the anchor mark of a heading that fills its line (BROWSER_NOTES)
    style: style.css
