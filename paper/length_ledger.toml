# The supervisor's rule: "the total length of the paper is less hard ceiling and more
# regularization. each word earns his place, and more text has a higher burden". The word count is
# still measured (tests/test_paper.py: the rendered prose the page shows, generated sentences
# included, builder labels excluded) but against the ceiling kept here, not a fixed cap. A section's
# ceiling is its baseline plus the words_added of the rows that name it; the total's ceiling is the
# total baseline plus every row. Growth is admitted by its job and refused without one: a row says
# what the added words do and for which reader. A cut lowers the ceiling to the count after (WP28
# OD5 (a)): a [[cut]] row says the date, the section, words_removed, what the content no longer did
# and the authority that cut it. The ceiling is the baseline plus the raise rows less the cut rows.
