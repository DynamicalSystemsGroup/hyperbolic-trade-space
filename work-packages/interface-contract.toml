format = "png"
# amendment 14: no committed figure; the directory holds exactly these files (none)
files = []

[derivation]
entry_cmd = "uv run python derivation/run.py"
dir = "derivation/"
run_module = "derivation.run"
run_attributes = ["CHAIN", "CHAIN_NAMES", "run_chain", "load_chain", "lemma_number", "print_audit", "main"]
axioms_module = "derivation.axioms"
axioms_attributes = ["AXIOMS", "by_tag", "fallbacks"]
chain_length = 14
module_pattern = "^lemma_([0-9]{2})_[a-z0-9_]+$"
numbering = "contiguous from 1; numbers never reused or renumbered; a new lemma takes the next number"
exit_codes = "0 on success, non-zero on a failed lemma"
generated_dir = "build/generated/"
generated_pages = ["derivations.md", "verification.md"]
generated_by = "scripts/build_generated.py"
generated_git = "ignored, never committed"
generated_consumer = "the paper's build (appendices); not the docsite"

[docs]
dir = "docs/"
pages = [
  "index.md", "getting-started.md", "user-guide/overview.md", "user-guide/conditioning.md",
  "user-guide/fitting.md", "user-guide/tensions.md", "user-guide/chart.md",
