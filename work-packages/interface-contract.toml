citation_syntax = "[@key]"
citation_multi = "[@key1; @key2]"
math_inline = "$...$"
math_display = "$$...$$"
rename_rule = "the presentation side owns the pages; the technical side edits none of them; a pinned page is renamed or removed only by an amendment"
api_reference_page = "docs/api-reference.md"
api_reference_source = "numpydoc docstrings of the public names, rendered by the docsite"
api_overview_page = "docs/api.md"
presentation_pages = [
  "docs/index.md", "docs/getting-started.md", "docs/user-guide/overview.md",
  "docs/user-guide/conditioning.md", "docs/user-guide/fitting.md", "docs/user-guide/tensions.md",
