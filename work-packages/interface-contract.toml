frozen_data_dir = "examples/adcs/data/"   # amendment 13: the frozen generation, the cited comparison; holds the files of case.data
data_rule = "committed, seeded; regenerated only by a package whose scope says so"
producing_command = "uv run python examples/adcs/k_terms.py"
smoke_run = "k_terms.run_regime(regime, seeds=[0], verbose=False)"

[case.regime_files]
