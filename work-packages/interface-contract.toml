select_tau = ["M", "K", "target"]
reports = ["est", "M", "band"]
term_record = ["est", "reps", "rows"]
certificate = ["est"]
run_regime = ["regime", "seeds", "n_max", "verbose"]
main = ["argv"]

[case.signatures.generate_dataset]
generate = ["n", "seed", "workers", "fast", "model", "slew_deg", "t_end", "gain_box"]
generate_cubesat = ["n", "seed", "workers", "fast", "slew_deg", "t_end", "gain_box"]
