[build]
tests_cmd = "uv run pytest"
lint_cmd = "uv run ruff check ."
format_cmd = "uv run ruff format --check ."
lock_cmd = "uv lock --check"
docs_cmd = "uv run --group docs mkdocs build --strict"
docs_out = "_site/docs/"
docs_config = "mkdocs.yml"
paper_cmd = "uv run myst build --html"
paper_cwd = "paper/"
paper_out = "_site/paper/"
paper_config = "paper/myst.yml"
root_index_source = "site/index.html"
root_index_out = "_site/index.html"
site_dir = "_site/"
public_paths = ["/", "/docs/", "/paper/"]
public_url = "https://dynamicalsystemsgroup.github.io/hyperbolic-trade-space/"
workflow = ".github/workflows/pages.yml"
workflow_deploys_on = "release tag v* and manual dispatch only; never on a push to main or dev"
workflow_never_deploys_from = "dev"
ci_workflow = ".github/workflows/test.yml"
branches = ["dev", "main"]
dependency_groups_required = ["dev", "docs", "notebooks", "case"]
default_groups = ["dev", "case", "docs"]
python = "3.12"

[build.dependency_groups_owner]
dev = "technical"
case = "technical"
notebooks = "technical"
docs = "wp8a"
paper = "wp10"

[build.stage]
release_control = "a merge to main that would deploy is preceded by a review of the staged localhost site, recorded in the merging package's decisions file"
script = "scripts/stage_site.py"
command = "uv run python scripts/stage_site.py --serve"
build_dir = "_stage/"
url = "http://127.0.0.1:8000"
network = false
kernel = false
default = true
delivered_by = "WP8a"

[ownership]
rule = "sides are pairwise disjoint; entries are explicit paths or directory prefixes; no globs"

[ownership.technical]
paths = [
  "src/", "derivation/", "tests/", ".python-version", ".github/workflows/test.yml", "README.md",
  "docs/superpowers/",
  "examples/adcs/k_terms.py", "examples/adcs/generate_dataset.py", "examples/adcs/design_space.py",
  "examples/adcs/cubesat_model.py", "examples/adcs/adcs_sim.py", "examples/adcs/make_check_designs.py",
  "examples/adcs/adcs_trade_study.ipynb", "examples/adcs/cubesat_tradespace.sysml",
  "examples/adcs/extended_design_space.sysml", "examples/adcs/data/", "examples/adcs/figures/",
  "examples/adcs/model_v2/", "examples/adcs/experiments/", "examples/adcs/case-model.md",
]

[ownership.process]
paths = ["work-packages/", "CLAUDE.md"]

[ownership.wp14]
paths = [
  "work-packages/interface-contract.md", "work-packages/interface-contract.toml",
  "tests/test_interface_contract.py",
]

[ownership.wp8a]
paths = [
  "mkdocs.yml", "glossary.yaml", "site/", "scripts/", ".github/workflows/pages.yml",
  "tests/test_site.py", "docs/index.md", "docs/getting-started.md", "docs/user-guide/",
  "docs/api.md", "docs/api-reference.md", "docs/examples.md", "docs/theory.md",
  "docs/further-reading.md", "docs/generated/", "docs/superpowers/notes/paper-sources/",
]

[ownership.wp10]
paths = [
  "paper/", "examples/adcs/case.py", "tests/test_paper.py", "tests/test_case.py",
  "docs/references.bib",
]

# WP12 touches presentation only through declared additions (additive amendment at its scope).
[ownership.wp12]
paths = []

[ownership.wp8b]
paths = ["CHANGELOG.md", "LICENSE", ".github/workflows/release.yml"]

[ownership.driver]
paths = ["pyproject.toml", "uv.lock", ".gitignore"]

# Files inside another side's directory prefix, owned by the named side.
[ownership.carve_outs]
"work-packages/interface-contract.md" = "wp14"
"work-packages/interface-contract.toml" = "wp14"
"tests/test_interface_contract.py" = "wp14"
"tests/test_site.py" = "wp8a"
"docs/superpowers/notes/paper-sources/" = "wp8a"
"tests/test_paper.py" = "wp10"
"tests/test_case.py" = "wp10"

[skips]
[skips.myst_config]
clause = "R-7 paper configuration"
file = "paper/myst.yml"
reason = "WP10 delivers the paper configuration"
closed_by = "WP10"
[skips.oracle_protocol]
clause = "R-3a Oracle protocol"
file = "examples/adcs/experiments/oracle.py"
reason = "WP15 delivers the protocol; pinned by additive amendment at its acceptance"
closed_by = "WP15"

[gaps]
[gaps.init_docstring]
what = "the docstring of src/hyperbolic_trade_space/__init__.py says package code arrives in later work packages"
closed_by = "WP8b"
[gaps.no_site_configs]
what = "paper/myst.yml does not exist"
closed_by = "WP10"
[gaps.paper_group]
what = "pyproject.toml has no paper dependency group"
closed_by = "WP10 (edit by the driver)"
[gaps.bib_ownership]
what = "docs/references.bib is assigned to WP10 (bibliography additions for the paper) although WP5 and WP13 own earlier content; docs/literature.md is a preserved source under docs/superpowers/notes/paper-sources/; later technical edits go through an amendment"
closed_by = "WP10"
[gaps.oracle_not_adopted]
what = "the Oracle protocol is stated but not yet pinned; the frozen cubesat pair stands in"
closed_by = "WP15"

