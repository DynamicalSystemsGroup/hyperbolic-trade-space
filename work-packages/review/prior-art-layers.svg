<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <!-- outer: the decision problem -->
  <rect x="20" y="20" width="720" height="400" rx="14" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="380" y="52" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">Trade studies, decision analysis and multi-criterion optimization</text>
  <text x="380" y="76" text-anchor="middle" font-size="14" fill="#374151">a design evaluated on many attributes; which objectives trade, and a choice someone must defend</text>
  <!-- middle: unsupervised learning -->
  <rect x="80" y="100" width="600" height="300" rx="12" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="380" y="132" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">Machine learning: dimensionality reduction and kernel methods</text>
  <text x="380" y="156" text-anchor="middle" font-size="14" fill="#374151">a table reduced to a structure a person can read; PCA finds variance, this work finds trade-offs</text>
  <!-- inner: the solver -->
  <rect x="150" y="182" width="460" height="196" rx="10" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <text x="380" y="262" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">Convex optimization and generalized geometric programs</text>
  <text x="380" y="288" text-anchor="middle" font-size="14" fill="#374151">the fit as a program that can be solved, with its guarantees</text>
  <text x="380" y="312" text-anchor="middle" font-size="14" fill="#374151">monomial: convex; posynomial: GGP-compatible</text>
</svg>
