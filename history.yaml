  - id: 2013-traffic-control
    date: "2013-10-18"
    kind: paper
    title: "Traffic Control for Network Protection Against Spreading Processes"
    people: [{name: "Victor Preciado"}, {name: "Michael Zargham"}, {name: "David Sun"}]
    url: https://arxiv.org/abs/1310.4894
    read_on: "2026-11-12"
    shows: "arXiv preprint submitted 18 October 2013; the abstract solves the problem by geometric programming."
    claim: sourced
    note: "Authors per the arXiv listing: Preciado, Zargham, Sun. It is the earliest entry of the record: the team's own earliest work, the 2013 to 2014 network-protection papers."

