# The history record: the dated public references and the people behind the lineage of this work.
#
# The page site/history.html is a view of this record (WP37, D-9): hand-written prose with names and
# pointers, and beneath it a dated reference list rendered from this file at build time
# (scripts/history_record.py, scripts/assemble_site.py). The record may hold more than the page
# shows; the page may show nothing the record does not hold. Tests tie every link, name and year on
# the page to an entry here (tests/test_site.py). Public sources only; every URL answers an
# unauthenticated request (scripts/check_history_links.py).
#
# Fields of each entry (all strings unless noted)
#   id            unique slug, "<year>-<what>" (people: "person-<surname>")
#   date          the work's date: "YYYY", "YYYY-MM" or "YYYY-MM-DD"; a year at least. For a page
#                 that carries no date of its own, the year of the evidence and the note says so
#   kind          paper | repository | post | video | talk | role | person
#   title         the work's title as its source gives it (a title may carry vocabulary that the
#                 page's own words do not use); for a person, the name
#   people        optional list of {name, role}: those the entry concerns, as its source credits them
#                 (an author line, a credits section, a contributors page; where the source is a
#                 contributors page, its count is in `shows`); a role only where a source states it,
#                 in the source's words; omitted otherwise
#   url           the one public URL the entry stands for; unique across the record
#   read_on       the day the page was read (YYYY-MM-DD)
#   shows         what the page says, and no more
#   claim         sourced (a source read states it) | link (the link itself shows it) |
#                 team-account (the team's own account; the page marks it as such)
#   special_case  optional bool, true where the work was in a highly public setting and the rule
#                 applies: the page names it only as "a special case where the work was highly
#                 public", never as the firm's focus
#   listed        optional bool (default true for every kind but person and role, which default to false): whether the
#                 generated reference list shows the entry
#   note          optional: where the entry came from, a spelling or a conflict between sources
#
# Spelling: Bernardineli (his GitHub profile name "Danilo Lessa Bernardineli", AUTHORS.txt);
# Penland (the public record, the supervisor's list gives the nickname "Octopus"); Carolina
# Riascos-Álvarez as her own site gives it, GitHub handle CarolinaRiascos (no LinkedIn anywhere).

entries:

